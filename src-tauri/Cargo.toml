[package]
name = "meeting-recorder"
version = "0.1.0"
description = "A local-first Atomik meeting recorder"
edition = "2021"

[lib]
name = "meeting_recorder_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
# Opt-in GPU transcription. Requires the CUDA Toolkit (nvcc, headers, libs) to
# be installed and on PATH at build time; NOT enabled by default so CI and
# non-NVIDIA machines keep building without it. See docs/transcription.md.
cuda = ["whisper-rs/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
cpal = "0.18.2"
chrono = "0.4.45"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hound = "3.5"
rubato = "5.0"
realfft = "3.5"
rustfft = "6.4"
whisper-rs = "0.16.0"
tauri-plugin-dialog = "2"
# Local meeting summaries call a local Ollama server only (see
# ollama_client.rs) over plain http://; the AppFlowy Cloud client
# (appflowy_client.rs) is the only user of the "tls" feature below, since it
# is the only module allowed to make a non-loopback https:// request.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
flacenc = "0.5.1"
claxon = "0.4.3"
# Cross-platform OS Recycle Bin/Trash for "Delete from disk" (recycle-bin
# mode). Pure Rust, dual MIT/Apache-2.0 licensed -- compatible with this
# project's dependency licensing.
trash = "5"

[target.'cfg(windows)'.dependencies]
# The upstream 1.13.8 static Windows archive is built with /MT, while
# whisper-rs builds its C++ backend with /MD.  Use Sherpa's supported shared
# Windows artifact so both native backends can coexist; its build script puts
# the required DLLs beside the executable. Other platforms retain static.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
# Kept on the version already present transitively in Cargo.lock.
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
] }
# AppFlowy Cloud refresh/access tokens (see appflowy_credentials.rs) live in
# the Windows Credential Manager, never in SQLite/settings/logs.
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
sherpa-onnx = "=1.13.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# System-output ("what the speakers play") capture on Linux. PulseAudio's
# client protocol is also served by PipeWire's pipewire-pulse compatibility
# layer on modern distros (Ubuntu 22.04+, Fedora, Debian 12, Arch), so one
# client implementation covers both sound servers without a PipeWire-native
# dependency. Build needs libpulse-dev + pkg-config; runtime needs
# libpulse.so.0, which both sound servers ship. See docs/audio-devices.md.
libpulse-binding = "2"
libpulse-simple-binding = "2"
# AppFlowy Cloud refresh/access tokens live in the Secret Service (GNOME
# Keyring/KWallet), never in SQLite/settings/logs; "vendored" statically
# links libdbus so this does not add a new runtime dependency.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "vendored"] }

# Dependency debug info dominates target/ size (whisper.cpp, sherpa-onnx, tauri).
# Keep full debug info for this crate only.
[profile.dev.package."*"]
debug = false
# The bundled SQLite C library (FTS5 included) is compiled by libsqlite3-sys's
# build script, which counts as a build-script/host artifact for Cargo's
# optimization settings -- `profile.dev.package.*` above does not reach it.
# Left at -O0 it makes the search index's own test suite (and any real
# startup reconcile of a large library) needlessly slow.
[profile.dev.build-override]
opt-level = 3
