name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Pinned so a runner-image migration can't silently change system packages.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v3-registry-only
          workspaces: src-tauri
          # Cache downloaded crates only. Caching target/ restored sherpa-onnx's
          # build-script outputs without the prebuilt libraries they point at,
          # which broke linking; a full build is slower but always correct.
          cache-targets: false
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Build-time libclang
        run: python -m pip install libclang==18.1.1
      - name: Locate libclang
        shell: python
        run: |
          import os, pathlib, clang
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('LIBCLANG_PATH=' + str(pathlib.Path(clang.__file__).parent / 'native') + '\n')
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpulse-dev pkg-config cmake
      - run: npm ci
      - run: npm run build
      - name: Install test browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: UI smoke tests
        if: runner.os == 'Linux'
        run: npm test
      - name: Extension logic tests
        if: runner.os == 'Linux'
        run: npm run test:extension
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Clippy (zero warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: npm run tauri -- build --debug --no-bundle
