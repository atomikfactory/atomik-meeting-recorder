name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build-time libclang
        run: python -m pip install libclang==18.1.1
      - name: Locate libclang
        shell: python
        run: |
          import os, pathlib, clang
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('LIBCLANG_PATH=' + str(pathlib.Path(clang.__file__).parent / 'native') + '\n')
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpulse-dev pkg-config cmake
      - run: npm ci
      - run: npm run build
      - name: Install test browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: UI smoke tests
        if: runner.os == 'Linux'
        run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri -- build --debug --no-bundle
